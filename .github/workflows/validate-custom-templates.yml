name: Validate Appointments custom templates
on:
  push:
    branches:
      - feature/custom-html-text-templates
  pull_request:
    paths:
      - '**.php'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/validate-custom-templates.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP sources
        run: |
          find lib appinfo templates -name '*.php' -print0 | xargs -0 -n 1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Vue assets
        run: npm run build
